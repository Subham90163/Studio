services:
  - type: web
    name: studio-management-system
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: 10000
      - key: MongoDB__ConnectionString
        sync: false
      - key: MongoDB__DatabaseName
        value: StudioDB
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: StudioAPI
      - key: Jwt__Audience
        value: StudioClient
